name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test authentication feedback
        run: pnpm --filter @agent-social/stub-agent exec tsx --test ../../apps/web/src/lib/auth/feedback.test.ts

      - name: Test PostgreSQL migrations and authorization
        run: pnpm --filter @agent-social/stub-agent exec tsx --test src/postgres.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/social_test

      - name: Build
        run: pnpm build

      - name: Run P0a acceptance demo
        shell: bash
        run: |
          pnpm dev > "${RUNNER_TEMP}/agent-social-dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          pnpm demo
